services:
  vfs-server:
    build:
      context: ../..
      dockerfile: vfs_server/deploy/Dockerfile
    command: ["--root","/var/lib/keddeh-vfs","--host","0.0.0.0","--port","8787","--token-file","/run/secrets/vfs_token"]
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - vfs-data:/var/lib/keddeh-vfs
    secrets:
      - vfs_token
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
secrets:
  vfs_token:
    file: ./secrets/vfs_token
volumes:
  vfs-data:
