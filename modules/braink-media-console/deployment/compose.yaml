services:
  media-worker:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m
    volumes:
      - media-state:/var/lib/braink-media
      - ./private/media-agent.json:/run/secrets/media-agent.json:ro
      - ./models:/opt/models:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  media-state:
