name: Repository integrity
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate tracked JSON and shell syntax
        shell: bash
        run: |
          python - <<'PYTHON'
          import json
          import pathlib
          import subprocess
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          checked = 0
          for name in filter(None, paths):
              path = pathlib.Path(name)
              if path.is_symlink():
                  continue
              if path.suffix == '.json':
                  json.loads(path.read_text(encoding='utf-8'))
                  checked += 1
              elif path.suffix == '.sh':
                  subprocess.run(['bash', '-n', str(path)], check=True)
                  checked += 1
          print(f'Validated {checked} tracked JSON/shell files')
          PYTHON
