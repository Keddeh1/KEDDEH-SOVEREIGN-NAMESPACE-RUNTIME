name: QZL durable commit qualification
on:
  pull_request:
    paths: ['deployment/qzl-resident/**', '.github/workflows/qzl-durability.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crash-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared owner dependencies
        run: python -m pip install .
      - name: Real subprocess crash boundaries with owner VFS
        run: python deployment/qzl-resident/scheduler/test_crash.py
      - uses: actions/upload-artifact@v4
        with:
          name: actual-crash-qualification
          path: deployment/qzl-resident/scheduler/crash-qualification.json
          if-no-files-found: error
