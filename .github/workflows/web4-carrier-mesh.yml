name: WEB4 carrier mesh discovery
on:
  push:
    paths:
      - 'src/keddeh_namespace/web4_bridge.js'
      - 'src/keddeh_namespace/web4_panel.js'
      - 'tests/test_web4_carrier_mesh.mjs'
      - '.github/workflows/web4-carrier-mesh.yml'
  pull_request:
    paths:
      - 'src/keddeh_namespace/web4_bridge.js'
      - 'src/keddeh_namespace/web4_panel.js'
      - 'tests/test_web4_carrier_mesh.mjs'
      - '.github/workflows/web4-carrier-mesh.yml'
permissions:
  contents: read
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify read-only original terminal and carrier paths
        run: node --test tests/test_web4_carrier_mesh.mjs
